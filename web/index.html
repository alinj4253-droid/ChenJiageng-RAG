<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嘉庚智答 - RAG问答系统</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 260px;
            background: #1e1e2e;
            color: #fff;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #333; }
        .sidebar-header h1 { font-size: 18px; margin-bottom: 4px; color: #89b4fa; }
        .sidebar-header p { font-size: 12px; color: #888; }
        .new-chat-btn {
            margin: 16px; padding: 10px;
            background: #4a90d9; color: #fff;
            border: none; border-radius: 8px;
            cursor: pointer; font-size: 14px;
            transition: all 0.2s;
        }
        .new-chat-btn:hover { background: #357abd; }
        .session-list { flex: 1; overflow-y: auto; padding: 0 8px; }
        .session-item {
            padding: 10px 12px; margin: 4px 0;
            border-radius: 6px; cursor: pointer;
            font-size: 13px; color: #ccc;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .session-item:hover { background: #333; }
        .session-item.active { background: #4a90d9; color: #fff; }

        .main { flex: 1; display: flex; flex-direction: column; }
        .chat-header {
            padding: 16px 24px; background: #fff;
            border-bottom: 1px solid #e0e0e0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-header h2 { font-size: 16px; color: #333; }
        .graph-link { font-size: 13px; color: #4a90d9; text-decoration: none; }
        .graph-link:hover { text-decoration: underline; }

        .messages {
            flex: 1; overflow-y: auto;
            padding: 24px;
            width: 100%;
        }
        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
        }
        .message.user { flex-direction: row-reverse; }
        .avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold;
            flex-shrink: 0;
        }
        .message.user .avatar { background: #4a90d9; color: #fff; }
        .message.assistant .avatar { background: #2ecc71; color: #fff; }
        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
        }
        .message.user .bubble {
            background: #4a90d9; color: #fff;
            border-top-right-radius: 4px;
        }
        .message.assistant .bubble {
            background: #fff; color: #333;
            border-top-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .thinking {
            font-size: 12px; color: #888;
            margin-bottom: 8px;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 6px;
            border-left: 3px solid #4a90d9;
        }
        .thinking.collapsed {
            padding: 4px 8px;
            background: #f0f9ff;
            color: #4a90d9;
            cursor: pointer;
            font-size: 12px;
        }
        .thinking-content {
            margin-top: 4px;
            color: #666;
            line-height: 1.5;
        }
        .references {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #666;
        }
        .references-title { font-weight: 600; margin-bottom: 4px; }
        .ref-item {
            padding: 4px 0;
            color: #4a90d9;
        }
        .input-area {
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #e0e0e0;
        }
        .input-wrapper {
            width: 100%;
            display: flex;
            gap: 10px;
        }
        #input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            resize: none;
            height: 48px;
        }
        #input:focus { border-color: #4a90d9; }
        #send-btn {
            padding: 0 24px;
            background: #4a90d9; color: #fff;
            border: none; border-radius: 8px;
            cursor: pointer; font-size: 14px;
            height: 48px;
        }
        #send-btn:disabled { background: #aaa; cursor: not-allowed; }

        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            margin: 16px 0 10px;
            line-height: 1.3;
            font-weight: 600;
        }
        .markdown-body h1 { font-size: 1.4em; color: #1e3a8a; border-bottom: 2px solid #e0e7ff; padding-bottom: 6px; }
        .markdown-body h2 { font-size: 1.2em; color: #1e40af; }
        .markdown-body h3 { font-size: 1.05em; color: #1e40af; }
        .markdown-body p { margin: 10px 0; line-height: 1.7; }
        .markdown-body ul, .markdown-body ol { padding-left: 24px; margin: 10px 0; }
        .markdown-body li { margin: 6px 0; line-height: 1.6; }
        .markdown-body li::marker { color: #4a90d9; font-weight: bold; }
        .markdown-body strong { color: #dc2626; font-weight: 600; }
        .markdown-body em { color: #7c3aed; }
        .markdown-body blockquote {
            border-left: 4px solid #4a90d9;
            padding: 8px 16px;
            margin: 12px 0;
            background: #f0f7ff;
            border-radius: 0 6px 6px 0;
            color: #444;
        }
        .markdown-body code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 0.9em;
            color: #e11d48;
        }
        .markdown-body pre {
            background: #1e293b;
            padding: 12px 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }
        .markdown-body pre code {
            background: transparent;
            color: #e2e8f0;
            padding: 0;
        }
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            text-align: left;
        }
        .markdown-body th {
            background: #f1f5f9;
            font-weight: 600;
        }
        .markdown-body hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 16px 0;
        }
        .bubble {
            line-height: 1.7;
        }
        .cursor {
            display: inline-block;
            width: 8px; height: 16px;
            background: #4a90d9;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>嘉庚智答</h1>
            <p>知识增强RAG问答系统</p>
        </div>
        <button class="new-chat-btn" onclick="newChat()">+ 新建对话</button>
        <div class="session-list" id="session-list"></div>
    </div>
    <div class="main">
        <div class="chat-header">
            <h2>陈嘉庚相关文献智能问答</h2>
            <a href="/graph" class="graph-link">知识图谱可视化 →</a>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="input" placeholder="输入您的问题，按回车发送..." />
                <button id="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        let currentSessionId = null;
        let isGenerating = false;

        marked.setOptions({ breaks: true, gfm: true });

        // 加载会话列表
        async function loadSessions() {
            const res = await fetch('/api/sessions');
            const data = await res.json();
            const list = document.getElementById('session-list');
            list.innerHTML = '';
            data.sessions.forEach(s => {
                const div = document.createElement('div');
                div.className = 'session-item' + (s.session_id === currentSessionId ? ' active' : '');
                div.textContent = s.title;
                div.onclick = () => loadSession(s.session_id);
                list.appendChild(div);
            });
        }

        // 加载某个会话的历史
        async function loadSession(sid) {
            currentSessionId = sid;
            const res = await fetch(`/api/sessions/${sid}/messages`);
            const data = await res.json();
            const msgs = document.getElementById('messages');
            msgs.innerHTML = '';
            data.messages.forEach(m => {
                addMessage(m.role, m.content, m.sources ? JSON.parse(m.sources) : []);
            });
            loadSessions();
            // 检查这个会话是否还在后台生成中
            checkTaskStatus(sid);
        }

        // 轮询检查后台生成任务
        async function checkTaskStatus(sid) {
            const res = await fetch(`/api/task/${sid}/status`);
            const task = await res.json();
            if (task.done || task.status === 'idle') return;
            // 还在生成中，先加一个空的AI气泡
            addMessage('assistant', task.answer, task.references);
            // 开始轮询
            const timer = setInterval(async () => {
                const r = await fetch(`/api/task/${sid}/status`);
                const t = await r.json();
                if (t.done) {
                    // 生成完了，刷新消息列表
                    clearInterval(timer);
                    loadSession(sid);
                    return;
                }
                // 更新最后一个AI气泡内容
                const bubbles = document.querySelectorAll('.message.assistant .bubble');
                if (bubbles.length > 0) {
                    bubbles[bubbles.length-1].innerHTML = marked.parse(t.answer);
                }
            }, 500);
        }

        function newChat() {
            currentSessionId = null;
            document.getElementById('messages').innerHTML = '';
            loadSessions();
        }

        function addMessage(role, content, references = [], thinking = '') {
            const msgs = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? '我' : 'AI';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (thinking) {
                const t = document.createElement('div');
                t.className = 'thinking';
                t.textContent = thinking;
                bubble.appendChild(t);
            }

            const contentDiv = document.createElement('div');
            contentDiv.className = 'markdown-body';
            contentDiv.innerHTML = DOMPurify.sanitize(marked.parse(content));
            bubble.appendChild(contentDiv);

            if (references && references.length > 0) {
                const refDiv = document.createElement('div');
                refDiv.className = 'references';
                let html = '<div class="references-title">📚 引用来源：</div>';
                references.forEach((r, i) => {
                    html += `<div class="ref-item">[${i+1}] 《${r.book}》${r.chapter || ''}</div>`;
                });
                refDiv.innerHTML = html;
                bubble.appendChild(refDiv);
            }

            div.appendChild(avatar);
            div.appendChild(bubble);
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
            return contentDiv;
        }

        async function sendMessage() {
            const input = document.getElementById('input');
            const text = input.value.trim();
            if (!text || isGenerating) return;

            isGenerating = true;
            document.getElementById('send-btn').disabled = true;
            input.value = '';

            // 显示用户消息
            addMessage('user', text);

            // 显示AI思考中的气泡
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message assistant';
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = 'AI';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking';
            thinkingDiv.textContent = '正在思考...';
            bubble.appendChild(thinkingDiv);
            const contentDiv = document.createElement('div');
            contentDiv.className = 'markdown-body';
            bubble.appendChild(contentDiv);
            aiDiv.appendChild(avatar);
            aiDiv.appendChild(bubble);
            document.getElementById('messages').appendChild(aiDiv);

            let fullAnswer = '';
            let refs = [];

            try {
                const res = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: currentSessionId, message: text })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const event = JSON.parse(line.slice(6));

                        if (event.type === 'session') {
                            currentSessionId = event.session_id;
                        } else if (event.type === 'status') {
                            thinkingDiv.textContent = '🔄 ' + event.message;
                        } else if (event.type === 'token') {
                            fullAnswer += event.content;
                            thinkingDiv.style.display = 'none';
                            contentDiv.innerHTML = DOMPurify.sanitize(marked.parse(fullAnswer)) + '<span class="cursor"></span>';
                            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
                        } else if (event.type === 'done') {
                            refs = event.references || [];
                            contentDiv.innerHTML = DOMPurify.sanitize(marked.parse(fullAnswer));
                            // 添加引用
                            if (refs.length > 0) {
                                const refDiv = document.createElement('div');
                                refDiv.className = 'references';
                                let html = '<div class="references-title">📚 引用来源：</div>';
                                refs.forEach((r, i) => {
                                    html += `<div class="ref-item">[${i+1}] 《${r.book}》${r.chapter || ''}</div>`;
                                });
                                refDiv.innerHTML = html;
                                bubble.appendChild(refDiv);
                            }
                            loadSessions();
                        } else if (event.type === 'error') {
                            contentDiv.textContent = '错误: ' + event.message;
                        }
                    }
                }
            } catch (e) {
                contentDiv.textContent = '网络错误: ' + e.message;
            }

            isGenerating = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('input').focus();
        }

        // 回车发送
        document.getElementById('input').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendMessage();
        });

        // 初始化
        loadSessions();
    </script>
</body>
</html>
