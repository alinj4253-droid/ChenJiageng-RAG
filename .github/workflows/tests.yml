# GitHub Actions：在 push / Pull Request 时自动运行 pytest。
#
# 设计原则（见 README「测试」一节）：
# - 全部单元测试用 mock 隔离真实 LLM / 检索器 / Embedding 模型，
#   因此 CI 不需要 DeepSeek API Key、Neo4j 服务、真实 BGE 模型权重或 GPU；
# - 只安装 Python 依赖并运行 `pytest -q`，不上 Docker build / coverage 上传 /
#   release / deploy / GPU runner；
# - 需要真实环境的集成测试请标记 `@pytest.mark.integration`，默认不跑。
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q
